<!doctype html>
<html lang="zh-CN">
<head>

<style>
:root{
  --bg:#f5f7fa; --panel:#ffffff; --ink:#1c2733; --muted:#6b7a89;
  --accent:#0f6cbd; --line:#dbe3ec;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;
  background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:720px;width:100%;margin:0 auto;padding:0 20px}
.eyebrow{margin:0 0 10px;font-size:13px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--accent);font-weight:600}
h1{margin:0 0 12px;font-size:30px;line-height:1.3;font-weight:600;letter-spacing:-.01em}
.lede{margin:0 0 26px;max-width:560px;font-size:15px;color:var(--muted);line-height:1.75}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:13px 16px;transition:border-color .15s ease}
.card:hover{border-color:var(--accent)}
.card b{display:block;font-size:14px;font-weight:600}
.card span{font-size:12px;color:var(--muted)}
.home{display:inline-flex;align-items:center;gap:6px;margin-bottom:24px;
  padding:8px 15px;border-radius:7px;background:var(--accent);
  color:#fff;font-size:13.5px;font-weight:500}
.home:hover{background:#0d5da3}
footer{margin-top:32px;font-size:12.5px;color:var(--muted)}
footer a{color:var(--accent)}
footer a:hover{text-decoration:underline}
@media (max-width:600px){
  body{padding:48px 0}
  h1{font-size:24px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">404</p>
  <h1>这个地址没有页面</h1>
  <p class="lede">链接可能改过，也可能手输时少了一个字母。下面这些入口都是通的，直接点就行。</p>
  <a class="home" href="https://leslieryin.github.io/">← 回到入口页</a>
  <div class="grid">
    <a class="card" href="https://leslieryin.github.io/control-lab/">
      <b>自动控制原理</b><span>阶跃响应 / PID / Bode / Nyquist / 根轨迹</span>
    </a>
    <a class="card" href="https://leslieryin.github.io/modern-control-lab/">
      <b>现代控制理论</b><span>状态空间 / 能控能观 / 极点配置 / 卡尔曼滤波</span>
    </a>
    <a class="card" href="https://leslieryin.github.io/process-control-lab/">
      <b>过程控制</b><span>纯滞后 / Smith 预估 / 串级 / 前馈-反馈</span>
    </a>
    <a class="card" href="https://leslieryin.github.io/8086-emulator-lab/">
      <b>8086 虚拟实验箱</b><span>8086 CPU + 8255/8253/8259/ADC0808</span>
    </a>
  </div>
  <footer>全部项目以 MIT 许可开源 · <a href="https://github.com/Leslieryin">github.com/Leslieryin</a></footer>
</div>
</body>
